name: Bug report
description: Incorrect behavior in Repository Detective
labels: ["type/bug", "status/needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do **not** paste secrets, tokens, `.env`, or customer code.
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
  - type: input
    id: version
    attributes:
      label: Version / commit / image tag
      placeholder: main @ sha or rc-…
    validations:
      required: true
  - type: input
    id: health
    attributes:
      label: `/health` tools_summary (optional)
      placeholder: "available_count: 12, missing: []"
