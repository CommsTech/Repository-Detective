name: CI - source and UI acceptance

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Confirm reproducible modules
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Go formatting
        run: |
          files=$(git ls-files '*.go')
          result=$(printf '%s\n' "$files" | xargs gofmt -s -l)
          if [ -n "$result" ]; then printf '%s\n' "$result"; exit 1; fi
      - name: Frontend syntax and custom rule contract
        run: |
          node --check ui/static/app.js
          node scripts/test-ui-rule-builder.cjs
      - name: Executive self-scan and feedback offline contract tests
        run: |
          python3 -m unittest discover scripts/tests -v
          node --check ui/static/feedback.js
          node scripts/tests/test_feedback.cjs

      - name: Go vet, race tests and build
        run: |
          packages=$(go list ./... | grep -v '/e2e/results/')
          go vet $packages
          go test -race -count=1 $packages
          CGO_ENABLED=0 go build -o /tmp/repository-detective .
      - name: Docker core image build
        run: docker build --target core -t repository-detective:ci .

  executive_selfscan:
    name: Commit-pinned executive self-audit
    # Every source push must emit evidence, even when the scan service is
    # unavailable. An unconfigured service produces EVIDENCE_INCOMPLETE,
    # NOT a silently skipped audit or an implied security pass.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RD_SELFSCAN_URL: ${{ secrets.RD_SELFSCAN_URL }}
      RD_SELFSCAN_API_KEY: ${{ secrets.RD_SELFSCAN_API_KEY }}
      RD_SELFSCAN_OWNER: ${{ vars.RD_SELFSCAN_OWNER || github.repository_owner }}
      RD_SELFSCAN_REPO: ${{ vars.RD_SELFSCAN_REPO || 'Repository-Detective' }}
      RD_SELFSCAN_REQUIRED: ${{ vars.RD_SELFSCAN_REQUIRED || 'gitleaks,govulncheck,staticcheck' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Scan exact pushed commit using Repository Detective
        # GitHub-hosted runners cannot reach the LAN scan service. Keep the
        # evidence job non-blocking here so the run stays green while the
        # artifact is still produced and visibly marked incomplete.
        continue-on-error: true
        run: |
          python3 scripts/ci-selfscan-executive.py --sha "${GITHUB_SHA}" --forge github \
            --owner "${RD_SELFSCAN_OWNER}" --repo "${RD_SELFSCAN_REPO}" \
            --required "${RD_SELFSCAN_REQUIRED}" --output dist/selfscan
      - name: Verify executive evidence integrity
        if: always()
        continue-on-error: true
        run: |
          test -f dist/selfscan/executive-selfscan.json
          test -f dist/selfscan/executive-selfscan.md
          (cd dist/selfscan && sha256sum -c SHA256SUMS)
      - name: Upload executive evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repository-detective-executive-${{ github.sha }}
          path: dist/selfscan/
          if-no-files-found: error
          retention-days: 90
      - name: Record that CI does not attest self-scan coverage
        if: always()
        run: |
          if [ -s dist/selfscan/executive-selfscan.json ]; then
            echo "Self-scan evidence artifact was produced; see uploaded artifact." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: no self-scan evidence was produced for this commit." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "This workflow does not attest that the self-scan completed with full scanner coverage." >> "$GITHUB_STEP_SUMMARY"
