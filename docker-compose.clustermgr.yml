version: '3.8'

# Clustermgr deployment — exposes Bugbot on host port 8081.
# Logs go to stdout (docker logs gitea-bugbot -f).
#
# Usage:
#   cp .env.clustermgr.example .env
#   # edit .env with your tokens
#   docker compose -f docker-compose.clustermgr.yml up -d --build

services:
  gitea-bugbot:
    build: .
    image: gitea-bugbot:latest
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      BUGBOT_PORT: "8080"
      BUGBOT_LISTEN_HOST: "0.0.0.0"
      BUGBOT_LOG_LEVEL: info
      # Skip Gitea/AI ping on boot so the server binds immediately.
      # Health returns 503 "starting" during checks, then 200 "healthy".
      BUGBOT_SKIP_STARTUP_CHECKS: "true"
      BUGBOT_STARTUP_CHECK_TIMEOUT: "10"
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
