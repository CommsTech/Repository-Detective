version: '3.8'

# Public LAN binding — Bugbot reachable on all host interfaces at port 8081.
# Pair with pfSense port forward or a reverse proxy for internet access.
#
# Usage:
#   cp .env.clustermgr.example .env && edit .env
#   docker compose -f docker-compose.public.yml up -d --build
#
# Verify:
#   curl http://192.168.255.11:8081/health
#
# See docs/NETWORKING.md for pfSense NAT, reverse proxy, and Traefik options.

services:
  gitea-bugbot:
    build: .
    image: gitea-bugbot:latest
    ports:
      # Explicit bind on all interfaces — required for LAN + WAN NAT
      - "0.0.0.0:8081:8080"
    env_file:
      - .env
    environment:
      BUGBOT_PORT: "8080"
      BUGBOT_LISTEN_HOST: "0.0.0.0"
      BUGBOT_LOG_LEVEL: info
      BUGBOT_SKIP_STARTUP_CHECKS: "true"
      BUGBOT_STARTUP_CHECK_TIMEOUT: "10"
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped
    networks:
      - bugbot-public
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  bugbot-public:
    driver: bridge
    name: bugbot-public
