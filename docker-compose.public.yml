version: '3.7'

# Production-style deploy — host port 8081, binds all interfaces.
# Pair with a firewall NAT rule or reverse proxy so Gitea can reach webhooks.
#
#   cp .env.example .env && edit .env
#   docker compose -f docker-compose.public.yml up -d --build
#
# See docs/NETWORKING.md and docs/SETUP.md

services:
  gitea-bugbot:
    build: .
    image: gitea-bugbot:latest
    container_name: gitea-bugbot
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      BUGBOT_PORT: "8080"
      BUGBOT_LISTEN_HOST: "0.0.0.0"
      BUGBOT_LOG_LEVEL: info
      BUGBOT_SKIP_STARTUP_CHECKS: "true"
      BUGBOT_STARTUP_CHECK_TIMEOUT: "10"
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped
