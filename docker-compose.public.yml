version: '3.7'

# Production deploy — builds from Dockerfile, listens on host port 8081.
#
#   cp .env.example .env && edit .env
#   docker-compose -f docker-compose.public.yml up -d --build
#
# On DNS-filtered networks, run ./scripts/vendor-deps.sh first.
# See DEPLOYMENT.md and docs/SETUP.md

services:
  repository-detective:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_EXTERNAL_TOOLS: "true"
    image: repository-detective:latest
    container_name: repository-detective
    network_mode: host
    env_file:
      - .env
    environment:
      BUGBOT_PORT: "8081"
      BUGBOT_LISTEN_HOST: "0.0.0.0"
      BUGBOT_LOG_LEVEL: info
      BUGBOT_SKIP_STARTUP_CHECKS: "true"
      BUGBOT_STARTUP_CHECK_TIMEOUT: "10"
      BUGBOT_DATABASE_PATH: /app/data/bugbot.db
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./certs:/app/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped
