# Repository Detective — Private Beta safe defaults
# Copy to config/config.yaml and set secrets via .env (never commit real tokens).
#
# Safety posture: report-only first, no issue filing, no remediation PRs, no LLM gate.

port: "8081"
listen_host: "127.0.0.1"
log_level: "info"
startup_check_timeout: 10
api_key: ""
public_url: "http://127.0.0.1:8081"

auth_mode: api_key_only
session_secret: ""

gitea_url: "https://git.example.com"
gitea_token: ""
webhook_secret: ""

github_url: "https://api.github.com"
github_token: ""

ai_provider: ""
ai_base_url: ""
ai_api_key: ""
ai_model: ""
ai_insecure_skip_tls_verify: false

# standard: full deterministic scan + issue filing (legacy beta_standard maps here).
scan_profile: standard
analysis_depth: 2
max_file_size: 1048576
enable_security: true
enable_quality: true

enable_trivy: true
enable_grype: true
enable_gitleaks: true
enable_semgrep: true
enable_govulncheck: true
enable_gosec: true
enable_staticcheck: true
enable_hadolint: true
enable_checkov: true
enable_linters: true
enable_llm_auditors: false
enable_ai_risk_checks: false
scanner_timeout_seconds: 180
staticcheck_timeout_seconds: 300
min_issue_confidence: 0.7


database_enabled: true
database_driver: sqlite
database_path: ./data/repository-detective.db
ui_enabled: true
ui_base_path: /ui
scheduler_enabled: true

# Issue filing OFF — use report_only_dry_run on API until operator approves filing.
auto_create_issues: false
max_issues_per_run: 25
skip_low_severity: true
group_similar_issues: true
max_concurrent_analyses: 2
analysis_timeout: 900
rate_limit_per_minute: 60
skip_startup_checks: true

reporting:
  mode: high_signal
  default_issue_min_severity: high
  default_issue_min_confidence: high
  create_issues_for_low: false
  create_issues_for_tests: false
  create_issues_for_docs: false
  create_issues_for_examples: false
  create_issues_for_generated: false
  create_issues_for_vendor: false
  include_raw_scanner_output_in_issue: false
  max_issues_per_scan: 0
  group_similar_findings: true
  allow_all_categories: true
  preserve_all_findings: true
  manual_review_can_create_issue: false
  suppressed_findings_are_auditable: true
  default_action_by_severity:
    critical: manual_review
    high: manual_review
    medium: report_only
    low: report_only
    info: report_only

false_positive_reduction:
  enabled: true
  suppress_generated: true
  suppress_vendor: true
  suppress_minified: true
  suppress_test_fixtures: true
  suppress_docs_examples: true
  require_file_exists: true
  require_line_match: false
  lower_confidence_for_dev_dependencies: true
  lower_confidence_for_unreachable_code: true
  raise_confidence_when_multiple_scanners_agree: true

remediation_planner_enabled: true
remediation_pr_enabled: false
evidence_closure_enabled: true
evidence_closure_close_issues: false
evidence_closure_comment: true
issue_reconciliation_enabled: true
issue_reconciliation_comment: true
issue_reconciliation_close_verified: false
issue_reconciliation_close_duplicates: false

dogfood_backlog_control_enabled: true
dogfood_backlog_max_open_issues: 50
dogfood_backlog_allow_new_issue_severity:
  - critical
dogfood_backlog_allow_new_issue_confidence: high
dogfood_backlog_update_existing_only: true

preinstall_audit_enabled: true
preinstall_report_include_project_link: true
repository_detective_project_url: "https://github.com/CommsTech/Repository-Detective"

notifications_enabled: false
runner_delegation_enabled: false

llm_sanity_gate_enabled: false
llm_sanity_gate_max_tokens_per_scan: 0
llm_sanity_gate_apply_actions: false
llm_sanity_gate_low_medium_only: true

enable_health_checks: true
enable_tech_debt_checks: true
enable_reliability_checks: true
enable_maintainability_checks: true
enable_test_gap_checks: true
enable_performance_checks: true
enable_code_graph: true
graph_include_functions: true
graph_include_findings: true
