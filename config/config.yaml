# Gitea Bugbot Plugin Configuration

# Server Configuration
port: "8080"
log_level: "info"

# Gitea Configuration
gitea_url: "http://your-gitea-server:3000"
gitea_token: "your-gitea-access-token"
webhook_secret: "your-webhook-secret"

# OpenWebUI Configuration
openwebui_url: "http://your-openwebui-server:8080"
openwebui_token: "your-openwebui-api-token"

# Analysis Configuration
analysis_depth: 3
max_file_size: 1048576 # 1MB in bytes
enable_security: true
enable_quality: true

# Issue Management Configuration
auto_create_issues: true
max_issues_per_run: 50
skip_low_severity: false
group_similar_issues: true

# File Analysis Configuration
skip_patterns:
- "node_modules"
- "vendor"
- ".git"
- "build"
- "dist"
- "target"
- "bin"
- "obj"
- "coverage"
- "logs"
- "tmp"
- "temp"

# Language Mapping
language_mapping:
  ".go": "go"
  ".py": "python"
  ".js": "javascript"
  ".jsx": "javascript"
  ".ts": "typescript"
  ".tsx": "typescript"
  ".java": "java"
  ".cpp": "cpp"
  ".c": "c"
  ".cs": "csharp"
  ".php": "php"
  ".rb": "ruby"
  ".rs": "rust"
  ".swift": "swift"
  ".kt": "kotlin"
  ".scala": "scala"
  ".sh": "bash"
  ".ps1": "powershell"
  ".sql": "sql"
  ".html": "html"
  ".css": "css"
  ".xml": "data"
  ".yaml": "data"
  ".yml": "data"
  ".json": "data"
  ".md": "markdown"
  ".txt": "markdown"

# Issue Templates
issue_title_template: "[{{severity}}] {{title}}"
issue_body_template: |
  ## Issue Details

  **Severity:** {{severity}}
  **Category:** {{category}}
  **Confidence:** {{confidence}}

  ## Description

  {{description}}

  ## Context

  - **Repository:** {{repository}}
  - **Context:** {{context}}
  - **Commit:** {{commit}}

  ---
  *This issue was automatically generated by the Gitea Bugbot*

# Webhook Configuration
webhook_events:
- "push"
- "pull_request"
- "issues"

# Repository Filtering
repository_include_patterns: [] # Empty means all repositories
repository_exclude_patterns:
- "archived-*"
- "deprecated-*"
- "test-*"

# Performance Configuration
max_concurrent_analyses: 5
analysis_timeout: 300 # 5 minutes in seconds
rate_limit_per_minute: 60

# Logging Configuration
log_format: "text" # text or json
log_file: "" # Empty means stdout
log_max_size: 100 # MB
log_max_age: 30 # days
log_max_backups: 10
