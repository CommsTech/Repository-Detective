# Repository Detective Configuration
# Product: Repository Detective — Inspect. Analyze. Improve.
# Legacy Bugbot config keys, labels, and BUGBOT_* env vars remain supported.
# Prefer REPOSITORY_DETECTIVE_* environment variables for new deployments.

# Server Configuration
port: "8080"
listen_host: "0.0.0.0"
log_level: "info"
startup_check_timeout: 10
api_key: "change-me-to-a-secure-random-string"
public_url: "http://localhost:8080"

# Gitea Configuration
gitea_url: "http://your-gitea-server:3000"
gitea_token: "your-gitea-access-token"
webhook_secret: "your-webhook-secret"

# OpenWebUI Configuration (legacy — use ai_provider: openwebui instead)
openwebui_url: "http://your-openwebui-server:8080"
openwebui_token: "your-openwebui-api-token"
openwebui_model: "default"

# AI Provider Configuration (recommended)
# Supported: openai, anthropic, openrouter, ollama, openwebui, openclaw
ai_provider: "openai"
ai_base_url: ""        # optional — provider default used when empty
ai_api_key: "your-api-key"
ai_model: "gpt-4o-mini"

# Analysis Configuration
analysis_depth: 3

# Scan profile — see docs/SCAN_PROFILES.md
# Allowed: fast, standard_deterministic, strict_security, maintainer_deep, preinstall_cautious, custom
# Default custom preserves legacy per-toggle behavior for existing deployments.
scan_profile: custom
max_file_size: 1048576 # 1MB in bytes
enable_security: true
enable_quality: true

# Deterministic scanners (Trivy, Grype, gitleaks, Semgrep, linters) — see docs/SCANNERS.md
enable_trivy: true
enable_grype: true
enable_gitleaks: false
gitleaks_config: ""
gitleaks_timeout_seconds: 0
enable_semgrep: false
semgrep_config: p/ci
semgrep_timeout_seconds: 0
semgrep_max_findings: 100
semgrep_severity_threshold: INFO
enable_govulncheck: false
enable_gosec: false
enable_staticcheck: false
govulncheck_timeout_seconds: 0
gosec_timeout_seconds: 0
staticcheck_timeout_seconds: 0
go_scanner_max_findings: 100
enable_hadolint: false
enable_checkov: false
hadolint_timeout_seconds: 0
checkov_timeout_seconds: 0
iac_scanner_max_findings: 100
enable_linters: true
enable_llm_auditors: true
scanner_timeout_seconds: 120

# Gitea commit status / checks — see docs/GITEA_STATUS.md
enable_gitea_status: false
gitea_status_context: bugbot/security-scan
gitea_status_fail_on: high
gitea_status_warn_on: medium
gitea_status_include_scanner_failures: true
min_issue_confidence: 0.5

# Scanner workspace — see docs/SCANNERS.md
# api = changed-file fragments (default); archive = full repo zipball; auto = archive with api fallback
workspace_mode: api
workspace_max_size_mb: 500
workspace_max_files: 5000
workspace_archive_timeout_seconds: 0  # 0 = use analysis_timeout

# Qdrant semantic dedup — connect to your existing Qdrant server (see docs/QDRANT.md)
qdrant_enabled: false
qdrant_url: "http://127.0.0.1:6333"
qdrant_collection: "bugbot-findings"
qdrant_vector_size: 1536
qdrant_similarity_threshold: 0.85
embedding_model: "text-embedding-3-small"

# Issue Management Configuration
auto_create_issues: true
max_issues_per_run: 50
skip_low_severity: false
group_similar_issues: true

# File Analysis Configuration
skip_patterns:
- "node_modules"
- "vendor"
- ".git"
- "build"
- "dist"
- "target"
- "bin"
- "obj"
- "coverage"
- "logs"
- "tmp"
- "temp"

# Language Mapping
language_mapping:
  ".go": "go"
  ".py": "python"
  ".js": "javascript"
  ".jsx": "javascript"
  ".ts": "typescript"
  ".tsx": "typescript"
  ".java": "java"
  ".cpp": "cpp"
  ".c": "c"
  ".cs": "csharp"
  ".php": "php"
  ".rb": "ruby"
  ".rs": "rust"
  ".swift": "swift"
  ".kt": "kotlin"
  ".scala": "scala"
  ".sh": "bash"
  ".ps1": "powershell"
  ".sql": "sql"
  ".html": "html"
  ".css": "css"
  ".xml": "data"
  ".yaml": "data"
  ".yml": "data"
  ".json": "data"
  ".md": "markdown"
  ".txt": "markdown"

# Issue Templates
issue_title_template: "[{{severity}}] {{title}}"
issue_body_template: |
  ## Issue Details

  **Severity:** {{severity}}
  **Category:** {{category}}
  **Confidence:** {{confidence}}

  ## Description

  {{description}}

  ## Context

  - **Repository:** {{repository}}
  - **Context:** {{context}}
  - **Commit:** {{commit}}

  ---
  *This issue was automatically generated by Repository Detective*

# Webhook Configuration
webhook_events:
- "push"
- "pull_request"
- "issues"

# Repository Filtering
repository_include_patterns: [] # Empty means all repositories
repository_exclude_patterns:
- "archived-*"
- "deprecated-*"
- "test-*"

# Performance Configuration
max_concurrent_analyses: 5
analysis_timeout: 300 # 5 minutes in seconds
rate_limit_per_minute: 60

# Local database (Phase 5) — see docs/DATABASE.md
database_enabled: true
database_driver: sqlite
database_path: ./data/bugbot.db
database_dsn: ""

# Operator UI (Phase 6) — see docs/UI.md
ui_enabled: true
ui_base_path: /ui

# Scheduled full scans (Phase 7) — see docs/SCHEDULER.md
scheduler_enabled: true
scheduler_poll_interval_seconds: 60
scheduler_max_concurrent_scans: 1

# Pre-install audit (Phase 9) — third-party repo URL audit before install; see docs/PREINSTALL_AUDIT.md
preinstall_audit_enabled: true
preinstall_allow_private_networks: false
preinstall_max_repo_size_mb: 500
preinstall_max_files: 5000
preinstall_timeout_seconds: 600
preinstall_max_findings: 200
preinstall_allow_git_clone: true

# Repository health checks (Phase 10) — see docs/HEALTH_CHECKS.md
# Per-repo overrides: repo_settings table / UI / PUT /api/v1/repos/:id/settings (Phase 10B)
enable_health_checks: true
enable_tech_debt_checks: true
enable_reliability_checks: true
enable_maintainability_checks: true
enable_test_gap_checks: true
enable_performance_checks: true
enable_ai_risk_checks: false
health_max_findings: 100
health_large_file_lines: 1000
health_large_function_lines: 150
health_max_nesting_depth: 5
health_max_function_params: 7

# Repository map / code graph (Phase 11 / 11B) — see docs/CODE_GRAPH.md
# Per-repo overrides: enable_code_graph, graph_max_nodes, graph_max_edges,
# graph_timeout_seconds, graph_include_functions, graph_include_findings (nullable in repo_settings)
enable_code_graph: true
graph_max_nodes: 5000
graph_max_edges: 15000
graph_timeout_seconds: 120
graph_include_functions: true
graph_include_findings: true

# Runner delegation (Phase 12) — see docs/RUNNERS.md
runner_delegation_enabled: false
runner_mode: core
# runner_shared_secret: ""  # required when delegation enabled and mode != core
runner_job_timeout_seconds: 900
runner_max_concurrent_jobs: 2
runner_result_max_size_mb: 50
runner_artifact_retention_days: 14

# Branding compatibility (Phase 12B) — see docs/BRANDING_MIGRATION.md
# dual: write bugbot/* and repository-detective/* labels (default)
# legacy_only | new_only
label_compat_mode: dual

# Notifications (Phase 15) — see docs/NOTIFICATIONS.md
# No email support in this phase. Channel credentials are global only.
notifications_enabled: false
notification_min_severity: high
notification_cooldown_seconds: 300
telegram_enabled: false
# telegram_bot_token: ""
# telegram_chat_id: ""
slack_enabled: false
# slack_webhook_url: ""
discord_enabled: false
# discord_webhook_url: ""
webhook_notifications_enabled: false
# webhook_notification_url: ""
# webhook_notification_secret: ""

# Remediation planner (Phase 16) — see docs/REMEDIATION.md
# Planning only — no patches, branches, or PRs in this phase.
# Remediation planner (planning only until PR phase enabled)
remediation_planner_enabled: true
remediation_min_severity: medium
remediation_min_confidence: 0.80
remediation_use_ai: false
remediation_comment_on_issue: false

# Safe remediation PRs (disabled by default — branch + PR only, no auto-merge/close)
remediation_pr_enabled: false
remediation_pr_branch_prefix: repository-detective/fix
remediation_pr_require_approval: true
remediation_pr_max_files_changed: 3
remediation_pr_max_diff_lines: 100
remediation_pr_validation_timeout_seconds: 300

# Evidence-based closure (enabled by default; auto-close disabled)
evidence_closure_enabled: true
evidence_closure_close_issues: false
evidence_closure_comment: true
evidence_closure_require_scanner_success: true

# Logging Configuration
log_format: "text" # text or json
log_file: "" # Empty means stdout
log_max_size: 100 # MB
log_max_age: 30 # days
log_max_backups: 10
