version: '3.7'

# Pre-built image only — no build step on the target host.
#
# On a machine with network access:
#   docker compose build
#   docker save repository-detective:latest -o repository-detective-image.tar
#
# On the target host:
#   docker load -i repository-detective-image.tar
#   docker compose -f docker-compose.offline.yml up -d

services:
  repository-detective:
    image: repository-detective:latest
    container_name: repository-detective
    network_mode: host
    env_file:
      - .env
    environment:
      REPOSITORY_DETECTIVE_PORT: "8081"
      REPOSITORY_DETECTIVE_LISTEN_HOST: "0.0.0.0"
      REPOSITORY_DETECTIVE_LOG_LEVEL: info
      REPOSITORY_DETECTIVE_SKIP_STARTUP_CHECKS: "true"
      REPOSITORY_DETECTIVE_DATABASE_PATH: /app/data/repository-detective.db
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./certs:/app/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped
