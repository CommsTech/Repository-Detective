version: '3.7'

# Pre-built image only — no `build:` section.
# Use when the runtime host cannot run `docker build` (e.g. no outbound network).
#
# On a machine with network access:
#   docker build -t gitea-bugbot:latest .
#   docker save gitea-bugbot:latest -o gitea-bugbot-image.tar
#
# On the target host:
#   docker load -i gitea-bugbot-image.tar
#   docker compose -f docker-compose.offline.yml up -d
#   # legacy: docker-compose -f docker-compose.offline.yml up -d

services:
  gitea-bugbot:
    image: gitea-bugbot:latest
    container_name: gitea-bugbot
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      BUGBOT_PORT: "8080"
      BUGBOT_LISTEN_HOST: "0.0.0.0"
      BUGBOT_LOG_LEVEL: info
      BUGBOT_SKIP_STARTUP_CHECKS: "true"
      BUGBOT_STARTUP_CHECK_TIMEOUT: "10"
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped
