{{define "head"}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} — Repository Detective</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{.BasePath}}/static/theme.css">
{{end}}

{{define "nav"}}
<div class="rd-layout">
  <aside class="rd-sidebar">
    <a class="rd-brand" href="{{.BasePath}}{{if .APIKey}}?api_key={{.APIKey}}{{end}}">
      <img src="{{.BasePath}}/static/logo.png" alt="Repository Detective">
      <div class="rd-brand-text">
        <strong>Repository<br>Detective</strong>
        <span>Inspect · Analyze · Improve</span>
      </div>
    </a>
    <nav class="rd-nav">
      <a href="{{.BasePath}}{{if .APIKey}}?api_key={{.APIKey}}{{end}}"><span class="rd-nav-icon">◉</span> Dashboard</a>
      <a href="{{.BasePath}}/repos{{if .APIKey}}?api_key={{.APIKey}}{{end}}"><span class="rd-nav-icon">📁</span> Repositories</a>
      <a href="{{.BasePath}}/findings{{if .APIKey}}?api_key={{.APIKey}}{{end}}"><span class="rd-nav-icon">⚠</span> Findings</a>
      <a href="{{.BasePath}}/preinstall{{if .APIKey}}?api_key={{.APIKey}}{{end}}"><span class="rd-nav-icon">🔍</span> Pre-install audit</a>
      <a href="/onboard/" target="_blank"><span class="rd-nav-icon">⚙</span> Setup wizard</a>
    </nav>
  </aside>
  <div class="rd-main">
    <header class="rd-topbar">
      <div>
        <p class="rd-topbar-kicker">Control center</p>
        <h1>{{.Title}}</h1>
      </div>
    </header>
    <div class="rd-content">
{{end}}

{{define "foot"}}
    </div>
  </div>
</div>
{{end}}
