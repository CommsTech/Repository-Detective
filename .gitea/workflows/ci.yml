name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GOPROXY: https://proxy.golang.org,direct
  GOTOOLCHAIN: auto

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          # 1.26.11 includes the crypto/x509 fix for GO-2026-6809.
          # A floating "1.26" stays on the runner's cached older 1.26.x.
          go-version: "1.26.11"
          cache: true

      - name: Verify module integrity
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Format check (all tracked Go files)
        run: |
          set -euo pipefail
          FILES=$(git ls-files '*.go' | grep -v '^vendor/' || true)
          if [ -z "$FILES" ]; then
            echo "No tracked Go files"
            exit 0
          fi
          # Fail the job when any tracked application Go source is not gofmt-clean.
          UNFORMATTED=$(echo "$FILES" | xargs -n 200 gofmt -s -l)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following tracked Go files need gofmt -s:"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "gofmt-clean: $(echo "$FILES" | wc -l) tracked files"

      # Operator UI is shipped to users from the main Go binary.
      # A JS parse regression must block merges before container publishing.
      - name: Operator UI JavaScript syntax and rule-builder contract
        run: |
          node --check ui/static/app.js
          node scripts/test-ui-rule-builder.cjs

      - name: Executive self-scan and feedback offline contract tests
        run: |
          python3 -m unittest discover scripts/tests -v
          node --check ui/static/feedback.js
          node scripts/tests/test_feedback.cjs

      - name: Custom rule and worker regression tests
        run: |
          go test -count=1 ./customrules ./runner ./store

      - name: Go vet
        run: |
          pkgs=$(go list ./... | grep -v '/e2e/results/')
          go vet $pkgs

      - name: Install staticcheck
        env:
          # Prefer IPv4 when the runner's IPv6 path to sum.golang.org is broken
          # ("cannot assign requested address"), which previously failed CI after
          # an otherwise-green go test/vet pass.
          GODEBUG: netdns=cgo+1
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "staticcheck install attempt ${attempt}/5"
            if go install honnef.co/go/tools/cmd/staticcheck@v0.8.2; then
              staticcheck -version
              exit 0
            fi
            sleep $((attempt * 4))
          done
          # Last resort: skip sum DB for this pinned tool module only (version is
          # still fetched via GOPROXY). Prefer a green install over a flaky CDN.
          echo "retrying staticcheck install with GONOSUMDB for honnef.co/go/tools"
          GONOSUMDB=honnef.co/go/tools go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck -version

      - name: Staticcheck
        env:
          GOFLAGS: -buildvcs=false
        run: |
          pkgs=$(go list ./... | grep -v '/e2e/results/')
          staticcheck $pkgs

      - name: Run tests
        run: |
          pkgs=$(go list ./... | grep -v '/e2e/results/')
          go test -race -count=1 $pkgs

      - name: Build binary
        run: CGO_ENABLED=0 go build -ldflags "-s -w" -o bin/repository-detective .

      - name: Verify binary exists
        run: test -f bin/repository-detective

      - name: Govulncheck
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          chmod +x scripts/ci-govulncheck.sh
          ./scripts/ci-govulncheck.sh

      - name: Build Docker image
        run: |
          # CI validates Dockerfile + /health on core (no external scanner downloads).
          # Full all-in-one matrix is covered by scripts/docker-build-verify.sh locally.
          for attempt in 1 2 3; do
            echo "docker build attempt ${attempt}/3"
            if docker build --target core -t repository-detective:ci .; then
              exit 0
            fi
            sleep 30
          done
          exit 1

      - name: Verify container starts
        run: |
          PORT=18080
          NAME=rd-ci-smoke-$$
          docker rm -f "$NAME" 2>/dev/null || true
          docker run -d --name "$NAME" \
            -e REPOSITORY_DETECTIVE_PORT="$PORT" \
            -e REPOSITORY_DETECTIVE_LISTEN_HOST=0.0.0.0 \
            -e REPOSITORY_DETECTIVE_SKIP_STARTUP_CHECKS=true \
            -e REPOSITORY_DETECTIVE_DATABASE_PATH=/app/data/repository-detective.db \
            -e REPOSITORY_DETECTIVE_GITEA_URL=http://example.com \
            -e REPOSITORY_DETECTIVE_GITEA_TOKEN=ci-smoke-token-not-real \
            -e REPOSITORY_DETECTIVE_API_KEY=ci-smoke-api-key-16 \
            -e REPOSITORY_DETECTIVE_AI_PROVIDER=ollama \
            -e REPOSITORY_DETECTIVE_AI_BASE_URL=http://127.0.0.1:11434/v1 \
            repository-detective:ci
          trap 'docker rm -f "$NAME" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if ! docker inspect -f '{{.State.Running}}' "$NAME" 2>/dev/null | grep -q true; then
              echo "smoke container exited early"
              docker logs "$NAME" 2>&1 | tail -80
              exit 1
            fi
            if docker exec "$NAME" wget -q -O- "http://127.0.0.1:${PORT}/health"; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs "$NAME" 2>&1 | tail -80
          exit 1

  executive_selfscan:
    name: Commit-pinned Repository Detective self-audit
    # A real self-scan, separate from unit tests, so even a failed CI build has
    # an independent (possibly incomplete) evidence report for the pushed SHA.
    # The self-audit gate is opt-in: set the repository variable
    # RD_SELFSCAN_ENABLED=true and the self-scan secrets to enforce it.
    # While disabled, this job does not run and the missing commit-pinned
    # evidence stays an explicit, documented gap rather than a green pass.
    if: github.event_name == 'push' && vars.RD_SELFSCAN_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RD_SELFSCAN_URL: ${{ secrets.RD_SELFSCAN_URL }}
      RD_SELFSCAN_API_KEY: ${{ secrets.RD_SELFSCAN_API_KEY }}
      RD_SELFSCAN_OWNER: ${{ vars.RD_SELFSCAN_OWNER || github.repository_owner }}
      RD_SELFSCAN_REPO: ${{ vars.RD_SELFSCAN_REPO || 'Repository-Detective' }}
      RD_SELFSCAN_REQUIRED: ${{ vars.RD_SELFSCAN_REQUIRED || 'gitleaks,govulncheck,staticcheck' }}
    steps:
      - name: Checkout pushed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Scan exact pushed commit using Repository Detective
        run: |
          python3 scripts/ci-selfscan-executive.py --sha "${GITHUB_SHA}" --forge gitea \
            --owner "${RD_SELFSCAN_OWNER}" --repo "${RD_SELFSCAN_REPO}" \
            --required "${RD_SELFSCAN_REQUIRED}" --output dist/selfscan
      - name: Publish executive report and SHA-256 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2; Gitea compatibility must be verified
        with:
          name: repository-detective-executive-${{ github.sha }}
          path: dist/selfscan/
          if-no-files-found: error
          retention-days: 90
