name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GOPROXY: https://proxy.golang.org,direct
  GOTOOLCHAIN: auto

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Verify module integrity
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Format check (changed Go files)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          FILES=$(git diff --name-only --diff-filter=ACMRTUXB "$BASE" HEAD -- '*.go' | grep -v '^vendor/' || true)
          if [ -z "$FILES" ]; then
            echo "No Go files changed — skipping format check"
            exit 0
          fi
          UNFORMATTED=$(gofmt -s -l $FILES)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files need gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.6.1

      - name: Staticcheck
        run: staticcheck ./...

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Build binary
        run: CGO_ENABLED=0 go build -ldflags "-s -w" -o bin/repository-detective .

      - name: Verify binary exists
        run: test -f bin/repository-detective

      - name: Govulncheck
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          chmod +x scripts/ci-govulncheck.sh
          ./scripts/ci-govulncheck.sh

      - name: Build Docker image
        run: |
          # CI validates Dockerfile + /health on core (no external scanner downloads).
          # Full all-in-one matrix is covered by scripts/docker-build-verify.sh locally.
          for attempt in 1 2 3; do
            echo "docker build attempt ${attempt}/3"
            if docker build --target core -t repository-detective:ci .; then
              exit 0
            fi
            sleep 30
          done
          exit 1

      - name: Verify container starts
        run: |
          cid=$(docker run -d --rm -p 18080:8080 \
            -e REPOSITORY_DETECTIVE_PORT=8080 \
            -e REPOSITORY_DETECTIVE_SKIP_STARTUP_CHECKS=true \
            -e REPOSITORY_DETECTIVE_GITEA_URL=http://example.com \
            -e REPOSITORY_DETECTIVE_GITEA_TOKEN=test \
            -e REPOSITORY_DETECTIVE_AI_PROVIDER=ollama \
            -e REPOSITORY_DETECTIVE_AI_BASE_URL=http://127.0.0.1:11434/v1 \
            repository-detective:ci)
          sleep 5
          curl -sf http://127.0.0.1:18080/health
          docker stop "$cid"
