# Publish Repository Detective images.
#
# Canonical: Gitea Package Registry (configure via vars.RD_GITEA_REGISTRY)
# Mirror:    GHCR (ghcr.io/<owner>/repository-detective) — optional, for public discovery
#
# Runs on Gitea Actions when a v* tag is pushed. GitHub workflow of the same name
# only mirrors to GHCR after Gitea is the source of truth for git.

name: Docker publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag override (empty = git tag / sha)"
        required: false
        default: ""
      push_latest:
        description: "Also tag all-in-one as latest"
        type: boolean
        default: true
      mirror_ghcr:
        description: "Also mirror tags to ghcr.io (requires GHCR_TOKEN secret)"
        type: boolean
        default: true

env:
  GITEA_REGISTRY: ${{ vars.RD_GITEA_REGISTRY || format('git.example.com/{0}', github.repository_owner) }}
  GHCR_REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_NAME: repository-detective

jobs:
  verify:
    name: Validate release source before registry publication
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Verify source and application
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          node --check ui/static/app.js
          pkgs=$(go list ./... | grep -v '/e2e/results/')
          go vet $pkgs
          go test -race -count=1 $pkgs
          CGO_ENABLED=0 go build -o /tmp/repository-detective .
      - name: Generate commit-pinned release self-scan
        id: release_scan
        if: always()
        continue-on-error: true
        env:
          RD_SELFSCAN_URL: ${{ secrets.RD_SELFSCAN_URL }}
          RD_SELFSCAN_API_KEY: ${{ secrets.RD_SELFSCAN_API_KEY }}
          RD_SELFSCAN_OWNER: ${{ vars.RD_SELFSCAN_OWNER || github.repository_owner }}
          RD_SELFSCAN_REPO: ${{ vars.RD_SELFSCAN_REPO || 'Repository-Detective' }}
          RD_SELFSCAN_REQUIRED: ${{ vars.RD_SELFSCAN_REQUIRED || 'gitleaks,govulncheck,staticcheck' }}
        run: |
          python3 scripts/ci-selfscan-executive.py --sha "${GITHUB_SHA}" --forge gitea \
            --owner "${RD_SELFSCAN_OWNER}" --repo "${RD_SELFSCAN_REPO}" \
            --required "${RD_SELFSCAN_REQUIRED}" --output dist/selfscan
      - name: Upload release executive evidence (including incomplete reports)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2; verify Gitea runner compatibility
        with:
          name: repository-detective-release-evidence-${{ github.sha }}
          path: dist/selfscan/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce release evidence gate before publishing
        if: always()
        run: |
          python3 scripts/ci-release-evidence-gate.py --dir dist/selfscan \
            --sha "${GITHUB_SHA}" --forge gitea --repository "${GITHUB_REPOSITORY}"
  publish:
    needs: verify
    name: Build and push (Gitea primary)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Derive tags
        id: meta
        env:
          # Intermediate env avoids run-shell-injection on ${{ inputs.* }} inside run:
          INPUT_TAG: ${{ github.event.inputs.tag }} # nosemgrep: yaml.github-actions.security.run-shell-injection.run-shell-injection
        run: |
          set -eu
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SHA="${GITHUB_SHA:-${GITEA_SHA:-unknown}}"
          SHORT="$(echo "$SHA" | cut -c1-12)"
          if [ -n "${INPUT_TAG:-}" ]; then
            VERSION="${INPUT_TAG}"
          elif [ "${GITHUB_REF_TYPE:-${GITEA_REF_TYPE:-}}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME:-${GITEA_REF_NAME}}"
          else
            VERSION="sha-${SHORT}"
          fi
          IMAGE="$(echo "${GITEA_REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          TAGS="${IMAGE}:all-in-one,${IMAGE}:${VERSION},${IMAGE}:${VERSION}-all-in-one,${IMAGE}:latest"
          {
            echo "version=${VERSION}"
            echo "build_date=${BUILD_DATE}"
            echo "gitea_image=${IMAGE}"
            echo "gitea_tags=${TAGS}"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing version=${VERSION} → ${IMAGE}"

      - name: Log in to Gitea Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ vars.RD_GITEA_REGISTRY_HOST || 'git.example.com' }}
          username: ${{ secrets.RD_PACKAGE_USER || github.actor }}
          password: ${{ secrets.RD_PACKAGE_TOKEN || secrets.RD_RELEASE_TOKEN }}

      - name: Build and push all-in-one to Gitea
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          target: all-in-one
          push: true
          provenance: false
          build-args: |
            INSTALL_EXTERNAL_TOOLS=true
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          tags: ${{ steps.meta.outputs.gitea_tags }}
          cache-from: type=gha,scope=rd-all-in-one
          cache-to: type=gha,mode=max,scope=rd-all-in-one

      - name: Mirror all-in-one to GHCR (optional)
        if: ${{ github.event.inputs.mirror_ghcr != 'false' && (secrets.GHCR_TOKEN != '') }}
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -eu
          USER_NAME="${GHCR_USER:-${{ github.repository_owner }}}"
          # Password is passed on stdin so the token is not an echo argument in the job log.
          docker login ghcr.io -u "$USER_NAME" --password-stdin <<< "$GHCR_TOKEN"
          SRC="$(echo "${GITEA_REGISTRY}/${IMAGE_NAME}:${VERSION}" | tr '[:upper:]' '[:lower:]')"
          DEST="$(echo "${GHCR_REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          docker pull "$SRC"
          for t in "${VERSION}" "${VERSION}-all-in-one" all-in-one latest; do
            docker tag "$SRC" "${DEST}:${t}"
            docker push "${DEST}:${t}"
          done
          echo "Mirrored ${SRC} → ${DEST}"

      - name: Summary
        run: |
          {
            echo "### Published (Gitea canonical)"
            echo "- \`${{ steps.meta.outputs.gitea_image }}:${{ steps.meta.outputs.version }}\`"
            echo "- \`${{ steps.meta.outputs.gitea_image }}:all-in-one\`"
            echo ""
            echo "Pull:"
            echo "\`\`\`bash"
            echo "docker login ${{ vars.RD_GITEA_REGISTRY_HOST || 'git.example.com' }}"
            echo "docker pull ${{ steps.meta.outputs.gitea_image }}:all-in-one"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
