name: Operator task
about: Homelab operator action (deploy, config, wiki, credentials)
labels:
  - type/operator-task
  - status/needs-triage
body:
  - type: textarea
    id: task
    attributes:
      label: Task description
    validations:
      required: true
  - type: dropdown
    id: urgency
    attributes:
      label: Urgency
      options:
        - blocks beta
        - before marketing
        - routine
  - type: textarea
    id: evidence
    attributes:
      label: Evidence / links (no secrets)
