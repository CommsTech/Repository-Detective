version: '3.7'

# Default production deploy — bridge networking, localhost bind via port mapping.
#
#   cp .env.example .env && edit .env
#   docker compose up -d --build
#
# For host networking (homelab / legacy): docker compose -f docker-compose.yml -f docker-compose.host-network.yml up -d
# See DEPLOYMENT.md and docs/SETUP.md

services:
  repository-detective:
    build:
      context: .
      dockerfile: Dockerfile
      target: all-in-one
      args:
        INSTALL_EXTERNAL_TOOLS: "true"
        VERSION: ${RD_VERSION:-dev}
        COMMIT: ${RD_COMMIT:-local}
        BUILD_DATE: ${RD_BUILD_DATE:-unknown}
    image: repository-detective:all-in-one
    container_name: repository-detective
    ports:
      - "127.0.0.1:${REPOSITORY_DETECTIVE_PORT:-8081}:8081"
    env_file:
      - .env
    environment:
      REPOSITORY_DETECTIVE_PORT: "8081"
      REPOSITORY_DETECTIVE_LISTEN_HOST: "0.0.0.0"
      REPOSITORY_DETECTIVE_LOG_LEVEL: info
      REPOSITORY_DETECTIVE_SKIP_STARTUP_CHECKS: "true"
      REPOSITORY_DETECTIVE_STARTUP_CHECK_TIMEOUT: "10"
      REPOSITORY_DETECTIVE_DATABASE_PATH: /app/data/bugbot.db
      # Prefer REPOSITORY_DETECTIVE_API_KEY; falls back to legacy BUGBOT_API_KEY from .env
      REPOSITORY_DETECTIVE_API_KEY: ${REPOSITORY_DETECTIVE_API_KEY:-${BUGBOT_API_KEY}}
      BUGBOT_PORT: "8081"
      BUGBOT_LISTEN_HOST: "0.0.0.0"
      BUGBOT_LOG_LEVEL: info
      BUGBOT_SKIP_STARTUP_CHECKS: "true"
      BUGBOT_STARTUP_CHECK_TIMEOUT: "10"
      BUGBOT_DATABASE_PATH: /app/data/bugbot.db
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./certs:/app/certs:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/docker-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - rd-net

networks:
  rd-net:
    driver: bridge
