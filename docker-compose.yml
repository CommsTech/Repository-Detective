version: '3.8'

services:
  gitea-bugbot:
    build: .
    container_name: gitea-bugbot
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Server Configuration
      - BUGBOT_SERVER_HOST=0.0.0.0
      - BUGBOT_SERVER_PORT=8080
      - BUGBOT_SERVER_READ_TIMEOUT=30s
      - BUGBOT_SERVER_WRITE_TIMEOUT=30s
      
      # Gitea Configuration
      - BUGBOT_GITEA_URL=https://git.commsnet.org
      - BUGBOT_GITEA_TOKEN=3018659e00c0952cb78099d132c205762c05542f
      - BUGBOT_GITEA_API_TIMEOUT=30s
      
      # OpenWebUI Configuration
      - BUGBOT_OPENWEBUI_URL=https://ai.commsnet.org/api
      - BUGBOT_OPENWEBUI_API_KEY=sk-82fae28a7a214114b7606206de232371
      - BUGBOT_OPENWEBUI_MODEL=luna-tic-coder
      - BUGBOT_OPENWEBUI_TIMEOUT=60s
      - BUGBOT_OPENWEBUI_MAX_TOKENS=4000
      
      # Analysis Configuration
      - BUGBOT_ANALYSIS_MAX_DEPTH=3
      - BUGBOT_ANALYSIS_MAX_FILE_SIZE=1048576
      - BUGBOT_ANALYSIS_ENABLE_SECURITY_SCAN=true
      - BUGBOT_ANALYSIS_ENABLE_QUALITY_CHECK=true
      - BUGBOT_ANALYSIS_ENABLE_PERFORMANCE_ANALYSIS=true
      - BUGBOT_ANALYSIS_ENABLE_BEST_PRACTICES=true
      - BUGBOT_ANALYSIS_ENABLE_DOCUMENTATION_REVIEW=true
      
      # Issue Management Configuration
      - BUGBOT_ISSUES_AUTO_CREATE=true
      - BUGBOT_ISSUES_MAX_PER_RUN=50
      - BUGBOT_ISSUES_SKIP_LOW_SEVERITY=false
      - BUGBOT_ISSUES_GROUP_SIMILAR=true
      - BUGBOT_ISSUES_TITLE_TEMPLATE="[Bugbot] {{.Type}}: {{.Summary}}"
      - BUGBOT_ISSUES_BODY_TEMPLATE="Issue detected: {{.Type}} - {{.Description}} | File: {{.File}}:{{.Line}} | Fix: {{.Suggestion}}"
      
      # File Filtering Configuration
      - BUGBOT_FILTERS_SKIP_PATTERNS=.git/,.svn/,.hg/,.bzr/,node_modules/,vendor/,dist/,build/,*.min.js,*.min.css,*.map
      - BUGBOT_FILTERS_SKIP_EXTENSIONS=.exe,.dll,.so,.dylib,.bin,.obj,.o,.a,.lib,.dll,.so,.dylib,.jar,.war,.ear,.zip,.tar,.gz,.rar,.7z
      
      # Webhook Configuration
      - BUGBOT_WEBHOOKS_ENABLE_PUSH_EVENTS=true
      - BUGBOT_WEBHOOKS_ENABLE_PULL_REQUEST_EVENTS=true
      - BUGBOT_WEBHOOKS_ENABLE_ISSUE_EVENTS=false
      - BUGBOT_WEBHOOKS_SECRET=your-webhook-secret-here
      
      # Repository Filtering
      - BUGBOT_REPOSITORIES_INCLUDE_PATTERNS=*
      - BUGBOT_REPOSITORIES_EXCLUDE_PATTERNS=
      - BUGBOT_REPOSITORIES_MAX_SIZE=1000000000
      
      # Performance Configuration
      - BUGBOT_PERFORMANCE_MAX_CONCURRENT_ANALYSES=5
      - BUGBOT_PERFORMANCE_ANALYSIS_TIMEOUT=300s
      - BUGBOT_PERFORMANCE_RATE_LIMIT=100
      - BUGBOT_PERFORMANCE_RATE_LIMIT_WINDOW=1m
      
      # Logging Configuration
      - BUGBOT_LOGGING_LEVEL=info
      - BUGBOT_LOGGING_FORMAT=json
      - BUGBOT_LOGGING_OUTPUT=stdout
      
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    networks:
      - bugbot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  bugbot-network:
    driver: bridge
