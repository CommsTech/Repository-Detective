# Repo-local gitleaks config (auto-discovered when gitleaks_config is unset).
# Must extend defaults — allowlist-only configs silently disable all detectors.

title = "repository-detective"

[extend]
useDefault = true

[allowlist]
description = "Synthetic fixtures and vendor trees"
paths = [
  '''(^|/)vendor/''',
  '''(^|/)testdata/''',
  '''(^|/)benchmark/fixture/''',
  '''\.go\.src$''',
  '''(^|/)docs/dogfood-reports/''',
  '''(^|/)deployment-backups/''',
  '''(^|/)data/tmp/''',
]
