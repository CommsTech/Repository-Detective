version: '3.7'

# Clustermgr — pre-built image only (no `docker build` on this host).
# Use after: docker load -i gitea-bugbot-image.tar
#
# Legacy docker-compose 1.x:
#   docker-compose -f docker-compose.clustermgr.offline.yml up -d

services:
  gitea-bugbot:
    image: gitea-bugbot:latest
    container_name: gitea-bugbot
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      BUGBOT_PORT: "8080"
      BUGBOT_LISTEN_HOST: "0.0.0.0"
      BUGBOT_LOG_LEVEL: info
      BUGBOT_SKIP_STARTUP_CHECKS: "true"
      BUGBOT_STARTUP_CHECK_TIMEOUT: "10"
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped
